; Trail Replay — PostgreSQL WAL stream process (supervisord watchdog)
;
; Install:
;   go build -o /tmp/trail-replay-stream ./cmd/stream-process
;   sudo install -m 0755 /tmp/trail-replay-stream /usr/local/bin/trail-replay-stream
;   sudo useradd --system --no-create-home --shell /usr/sbin/nologin trailreplay
;   sudo install -d -o trailreplay -g trailreplay /var/lib/trail-replay /var/log/trail-replay
;   sudo cp deploy/supervisord/trail-replay-stream.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Manage:
;   sudo supervisorctl status trail-replay-stream
;   sudo supervisorctl restart trail-replay-stream
;   tail -f /var/log/trail-replay/stream.log

[program:trail-replay-stream]
command=/usr/local/bin/trail-replay-stream
directory=/var/lib/trail-replay
user=trailreplay

; --- Supervision & auto-restart ---
; respawn on any exit, clean or crash; only exit code 0 is "expected".
; Must stay up 5s to count as successfully started; after 5 rapid
; failures the program enters FATAL state and supervisord stops retrying.
autostart=true
autorestart=true
startsecs=5
startretries=5
exitcodes=0

; Graceful stop: the process handles SIGINT/SIGTERM via signal.Notify.
stopsignal=TERM
stopwaitsecs=15

; Log rotation handled by supervisord.
stdout_logfile=/var/log/trail-replay/stream.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
